<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot (Table Fixed Like ChatGPT)</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 { color: #333; }
    #chatBox {
      width: 450px;
      height: 420px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 10px 15px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 90%;
      word-wrap: break-word;
    }
    .user {
      background: #cde3ff;
      align-self: flex-end;
    }
    .bot {
      background: #f3f3f3;
      align-self: flex-start;
    }
    #inputArea {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }

    /* Beautiful table like ChatGPT */
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    th, td {
      border: 1px solid #d0d0d0;
      padding: 8px 10px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    /* Code block style */
    pre, code {
      background: #222;
      color: #eee;
      padding: 8px;
      border-radius: 6px;
      display: block;
      overflow-x: auto;
      margin-top: 6px;
    }
    ul { margin-left: 18px; }
  </style>
</head>
<body>

  <h1>My AI Chatbot 🤖</h1>
  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Function to convert Markdown tables + styling
    function convertMarkdown(markdown) {
      // Convert code blocks first
      markdown = markdown.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");

      // Headings and formatting
      markdown = markdown
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/\*(.*?)\*/g, "<i>$1</i>")
        .replace(/\n/g, "<br>");

      // Convert Markdown tables
      const tableRegex = /((\|.*\|)\n)+/g;
      markdown = markdown.replace(tableRegex, (table) => {
        const rows = table.trim().split("\n");
        let html = "<table>";
        rows.forEach((row, index) => {
          if (/^\|[-\s|]+\|$/.test(row)) return; // skip --- separator
          const cells = row.split("|").filter(c => c.trim() !== "");
          if (index === 0) {
            html += "<tr>" + cells.map(c => `<th>${c.trim()}</th>`).join("") + "</tr>";
          } else {
            html += "<tr>" + cells.map(c => `<td>${c.trim()}</td>`).join("") + "</tr>";
          }
        });
        html += "</table>";
        return html;
      });

      return markdown;
    }

    // Add message to chat
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("msg", sender);
      msg.innerHTML = convertMarkdown(text);
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Send message to API
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage("🧑: " + text, "user");
      userInput.value = "";

      addMessage("⏳ Thinking...", "bot");

      try {
        const res = await fetch(`https://corsproxy.io/?https://api.nekolabs.web.id/ai/cf/gpt-oss-120b?text=${encodeURIComponent(text)}`);
        const data = await res.json();
        chatBox.lastChild.remove();

        // Handle nested response safely
        const reply = typeof data.result === "object"
          ? data.result.response || JSON.stringify(data.result)
          : data.result;

        addMessage("🤖: " + (reply || "No reply."), "bot");
      } catch (error) {
        chatBox.lastChild.remove();
        addMessage("⚠️ Error: " + error.message, "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
