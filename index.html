<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot (Fixed Markdown Display)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 { color: #333; }
    #chatBox {
      width: 420px;
      height: 420px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .user { background: #d1e7ff; align-self: flex-end; }
    .bot { background: #f3f3f3; align-self: flex-start; }

    #inputArea {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }

    /* Table design */
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 6px;
    }
    th, td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
    }
    th { background: #007bff; color: white; }

    /* Code block style */
    pre, code {
      background: #222;
      color: #eee;
      padding: 8px;
      border-radius: 6px;
      display: block;
      overflow-x: auto;
      margin-top: 6px;
    }
    ul { margin-left: 18px; }
  </style>
</head>
<body>

  <h1>My AI Chatbot 🤖</h1>
  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Convert Markdown to simple HTML (tables, code, lists, headings)
    function convertMarkdown(text) {
      // Convert code blocks (```...```)
      text = text.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      
      // Convert bold, italic, and headings
      text = text
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
        .replace(/\*(.*?)\*/g, "<i>$1</i>");
      
      // Lists
      text = text.replace(/^\* (.*$)/gim, "<ul><li>$1</li></ul>");
      text = text.replace(/^\- (.*$)/gim, "<ul><li>$1</li></ul>");
      
      // Line breaks
      text = text.replace(/\n/g, "<br>");

      // Convert Markdown tables
      const tableRegex = /((\|.*\|)\n)+/g;
      text = text.replace(tableRegex, (table) => {
        const rows = table.trim().split("\n");
        let html = "<table><tbody>";
        rows.forEach((row, index) => {
          if (/^\|[-\s|]+\|$/.test(row)) return; // skip separator
          const cells = row.split("|").filter(c => c.trim() !== "");
          if (index === 0) {
            html += "<tr>" + cells.map(c => `<th>${c.trim()}</th>`).join("") + "</tr>";
          } else {
            html += "<tr>" + cells.map(c => `<td>${c.trim()}</td>`).join("") + "</tr>";
          }
        });
        html += "</tbody></table>";
        return html;
      });
      
      return text;
    }

    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("msg", sender);
      msg.innerHTML = convertMarkdown(text);
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage("🧑: " + text, "user");
      userInput.value = "";

      addMessage("⏳ Thinking...", "bot");

      try {
        const res = await fetch(`https://corsproxy.io/?https://api.nekolabs.web.id/ai/cf/gpt-oss-120b?text=${encodeURIComponent(text)}`);
        const data = await res.json();
        chatBox.lastChild.remove();

        // Handle nested object
        const reply = typeof data.result === "object" ? data.result.response || JSON.stringify(data.result) : data.result;
        addMessage("🤖: " + (reply || "No reply."), "bot");
      } catch (error) {
        chatBox.lastChild.remove();
        addMessage("⚠️ Error: " + error.message, "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
  </script>

</body>
</html>
