<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple AI Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 { color: #333; }
    #chatBox {
      width: 400px;
      height: 400px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user { 
      background: #d1e7ff; 
      align-self: flex-end; 
    }
    .bot { 
      background: #e8e8e8; 
      align-self: flex-start; 
    }
    #inputArea {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }

    /* Table styling for bot responses */
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 6px 8px;
      text-align: left;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <h1>My AI Chatbot 🤖</h1>
  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Function to convert Markdown tables to HTML tables
    function convertTables(markdown) {
      const tableRegex = /((\|.*\|)\n)+/g;
      return markdown.replace(tableRegex, (table) => {
        const rows = table.trim().split("\n");
        let html = "<table><tbody>";

        rows.forEach((row, index) => {
          if (/^\|[-\s|]+\|$/.test(row)) return; // skip separator row
          const cells = row.split("|").filter(c => c.trim() !== "");
          if (index === 0) {
            html += "<tr>" + cells.map(c => `<th>${c.trim()}</th>`).join("") + "</tr>";
          } else {
            html += "<tr>" + cells.map(c => `<td>${c.trim()}</td>`).join("") + "</tr>";
          }
        });

        html += "</tbody></table>";
        return html;
      });
    }

    // Function to add messages (with Markdown + table support)
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("msg", sender);

      // Markdown basic formatting
      text = text
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>") // bold
        .replace(/\*(.*?)\*/g, "<i>$1</i>")     // italic
        .replace(/`(.*?)`/g, "<code>$1</code>") // inline code
        .replace(/\n/g, "<br>");

      // Convert Markdown tables to real HTML tables
      text = convertTables(text);

      msg.innerHTML = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Function to send message to the API
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage("🧑: " + text, "user");
      userInput.value = "";

      addMessage("⏳ Thinking...", "bot");

      try {
        const res = await fetch(`https://corsproxy.io/?https://api.nekolabs.web.id/ai/cf/gpt-oss-120b?text=${encodeURIComponent(text)}`);
        const data = await res.json();

        chatBox.lastChild.remove(); // remove "Thinking..."
        
        // Fix for nested object
        const reply = typeof data.result === "object" ? data.result.response || JSON.stringify(data.result) : data.result;
        addMessage("🤖: " + (reply || "No reply."), "bot");
      } catch (error) {
        chatBox.lastChild.remove();
        addMessage("⚠️ Error: " + error.message, "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
