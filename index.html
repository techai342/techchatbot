<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test OpenRouter AI</title>
</head>
<body>
  <h1>OpenRouter AI Test</h1>
  <textarea id="userInput" rows="3" cols="50" placeholder="Type your message here"></textarea><br><br>
  <button id="sendBtn">Send</button>

  <h3>Response:</h3>
  <pre id="responseArea"></pre>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('userInput');
    const responseArea = document.getElementById('responseArea');

    sendBtn.addEventListener('click', async () => {
      const msg = userInput.value.trim();
      if (!msg) return alert("Type a message first!");

      responseArea.textContent = "Waiting for response...";

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "deepseek/deepseek-chat-v3.1:free",
            messages: [
              { role: "user", content: msg }
            ]
          })
        });

        const data = await res.json();
        responseArea.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        responseArea.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
