<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple AI Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 { color: #333; }
    #chatBox {
      width: 400px;
      height: 400px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }
    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 90%;
      word-wrap: break-word;
    }
    .user { 
      background: #d1e7ff; 
      align-self: flex-end; 
    }
    .bot { 
      background: #e8e8e8; 
      align-self: flex-start; 
    }
    table {
      border-collapse: collapse;
      margin-top: 5px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 4px 8px;
    }
    th {
      background: #ddd;
    }
    #inputArea {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 14px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h1>My AI Chatbot 🤖</h1>
  <div id="chatBox"></div>

  <div id="inputArea">
    <input type="text" id="userInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Function to convert Markdown tables to HTML
    function convertTables(markdown) {
      const lines = markdown.trim().split("\n");
      let html = "";
      let inTable = false;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.startsWith("|") && line.endsWith("|")) {
          if (!inTable) {
            html += "<table>";
            inTable = true;
          }
          // Skip separator line (----)
          if (line.match(/^\|[-\s|]+\|$/)) continue;

          const cells = line.split("|").slice(1, -1).map(c => c.trim());
          if (i > 0 && lines[i - 1].match(/^\|[-\s|]+\|$/)) {
            html += "<tr>" + cells.map(c => `<th>${c}</th>`).join("") + "</tr>";
          } else {
            html += "<tr>" + cells.map(c => `<td>${c}</td>`).join("") + "</tr>";
          }
        } else {
          if (inTable) {
            html += "</table>";
            inTable = false;
          }
          html += line + "<br>";
        }
      }

      if (inTable) html += "</table>";
      return html;
    }

    // Function to add messages to chat box (with Markdown support)
    function addMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("msg", sender);

      // Basic Markdown
      text = text
        .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>") // bold
        .replace(/\*(.*?)\*/g, "<i>$1</i>")     // italic
        .replace(/`(.*?)`/g, "<code>$1</code>") // code
        .replace(/\n/g, "<br>");                // line breaks

      // Convert tables after other markdown
      text = convertTables(text);

      msg.innerHTML = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Function to send message
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage("🧑: " + text, "user");
      userInput.value = "";

      addMessage("⏳ Thinking...", "bot");

      try {
        const res = await fetch(`https://corsproxy.io/?https://api.nekolabs.web.id/ai/cf/gpt-oss-120b?text=${encodeURIComponent(text)}`);
        const data = await res.json();

        chatBox.lastChild.remove(); // remove "Thinking..."
        console.log("API Response:", data);

        // Get actual bot reply
        let reply = "No reply.";
        if (data.result && data.result.response) {
          reply = data.result.response;
        } else if (data.response) {
          reply = data.response;
        } else if (typeof data.result === "string") {
          reply = data.result;
        } else if (data.message) {
          reply = data.message;
        }

        addMessage("🤖: " + reply, "bot");

      } catch (error) {
        chatBox.lastChild.remove();
        addMessage("⚠️ Error: " + error.message, "bot");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
